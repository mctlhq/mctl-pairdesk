name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@83de7592939117e7ce9bbeb524dd71b3a9eb23a4
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      # dependabot is listed so its PRs get reviewed automatically.
      # Without it claude-code-action hard-fails with "Workflow initiated
      # by non-human actor", and since branch protection requires an
      # approving review, dependabot PRs then sit unmergeable until a
      # maintainer triggers a review by hand.
      allowed-bots: "mctl-claude-remote,github-actions,dependabot"
      sensitive-paths: '^src/(services|routes|db|middleware|telegram)/'
      conventions: |
        mctl-pairdesk is a matchmaking/reservation board (NOT an exchange):
        no custody, no payments, no escrow.
        - Concurrency: the order-reservation accept flow MUST stay race-safe
          — accept locks the order (FOR NO KEY UPDATE) and only one deal may
          win (partial unique index uq_deals_winner); watch for missing row
          locks, lost updates, double-win, and sweeper/accept races.
        - Sensitive-data leakage: phone / contact / payment-account fields
          must NEVER appear in a public order serializer or order-book
          payload. Contact details may only be returned by the deal
          serializer to the creator or chosen responder when the deal is
          accepted/completed AND the order is reserved/completed.
        - RBAC gates (requireApproved / requireRole), Telegram initData
          validation.
        - Closed-access integrity: pending/blocked users must not reach
          approved-only routes; community_id scoping must not be bypassable.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
